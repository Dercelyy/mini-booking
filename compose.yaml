name: yan-booking
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-booking}
      POSTGRES_USER: ${DB_USERNAME:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test.sql:/docker-entrypoint-initdb.d/init-test.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_ENV: local
      APP_DEBUG: "false"
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Krasnoyarsk}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-booking}
      DB_USERNAME: ${DB_USERNAME:-booking}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: array
      SESSION_DRIVER: array
      LOG_CHANNEL: stderr
      PHP_CLI_SERVER_WORKERS: 4
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
